name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: json-codex-windows
          path: release/json-codex-window.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # CI artifacts use an ad-hoc signature, with no Apple release identity.
      # Release signing/notarization is a separate, documented local build.
      - name: Build universal macOS validation artifact
        run: npm run build:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify universal bundle and isolated helper smoke
        run: npm run verify:mac
      - uses: actions/upload-artifact@v4
        with:
          name: json-codex-macos-universal-${{ matrix.runner }}-adhoc
          path: release/json-codex-macos-universal.dmg
          if-no-files-found: error
